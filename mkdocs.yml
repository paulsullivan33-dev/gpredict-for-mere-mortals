site_name: GPredict for Mere Mortals
site_description: A satellite tracker that shows where a satellite is right now and when it will next pass over your station. Reading the map, polar and data views, predicting passes days ahead, and driving a real radio and antenna rotator through Hamlib, with the limits stated plainly.
site_url: https://paulsullivan33-dev.github.io/gpredict-for-mere-mortals/
